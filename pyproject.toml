[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taskwarrior-textual"
version = "0.1.0"
description = "Textual TUI for Taskwarrior with project planning and analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Florian MAILLARD" }]
keywords = ["taskwarrior", "timewarrior", "tui", "project-management", "planning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = ["textual>=0.70"]

[project.urls]
Homepage = "https://github.com/fmaillar/taskwarrior-textual"
Repository = "https://github.com/fmaillar/taskwarrior-textual"
Documentation = "https://github.com/fmaillar/taskwarrior-textual/tree/main/docs"
Issues = "https://github.com/fmaillar/taskwarrior-textual/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
]

[project.scripts]
taskwarrior-textual = "taskwarrior_textual.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taskwarrior_textual"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "--cov=taskwarrior_textual",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-branch",
]

[tool.coverage.run]
branch = true
source = ["taskwarrior_textual"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["src/taskwarrior_textual"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
