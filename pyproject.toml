[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taskwarrior-textual"
version = "0.1.0"
description = "Textual TUI for Taskwarrior with project planning and analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Florian Maillar" }]
dependencies = ["textual>=0.70"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
taskwarrior-textual = "taskwarrior_textual.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taskwarrior_textual"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
