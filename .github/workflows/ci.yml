name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.repository == 'fmaillar/taskwarrior-textual-dev'
    name: Full gate / Python 3.13
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and development dependencies
        run: make reinstall PYTHON=python

      - name: Validate example configuration
        run: |
          TASKWARRIOR_TEXTUAL_CONFIG=config.example.toml \
            .venv/bin/taskwarrior-textual --check-config

      - name: Check CLI version
        run: .venv/bin/taskwarrior-textual --version

      - name: Run full quality gate
        run: make check

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-python-3.13
          path: |
            reports/
            dist/
          if-no-files-found: warn

  compatibility:
    if: github.repository == 'fmaillar/taskwarrior-textual-dev'
    name: Compatibility / Python 3.11
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and development dependencies
        run: make reinstall PYTHON=python

      - name: Validate example configuration
        run: |
          TASKWARRIOR_TEXTUAL_CONFIG=config.example.toml \
            .venv/bin/taskwarrior-textual --check-config

      - name: Check CLI version
        run: .venv/bin/taskwarrior-textual --version

      - name: Run compatibility tests without duplicate coverage/build work
        run: make test-compat
