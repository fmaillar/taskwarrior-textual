name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development dependencies
        run: make reinstall PYTHON=python

      - name: Validate example configuration
        run: |
          TASKWARRIOR_TEXTUAL_CONFIG=config.example.toml \
            .venv/bin/taskwarrior-textual --check-config

      - name: Check CLI version
        run: .venv/bin/taskwarrior-textual --version

      - name: Run Ruff, tests, and branch coverage
        run: make check

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
